<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gorilla Tag 3D (Mobile & Desktop VR Sandbox)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b1120;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #game-canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* Mobile Touch Controls UI */
        .mobile-ui {
            display: none;
        }
        @media (pointer: coarse) {
            .mobile-ui {
                display: flex;
            }
        }
    </style>
</head>
<body class="relative overflow-hidden">
    <canvas id="game-canvas"></canvas>

    <!-- Mobile Virtual Joystick (Left) -->
    <div id="joystick-zone" class="mobile-ui absolute bottom-8 left-8 w-36 h-36 bg-slate-800/40 backdrop-blur-md rounded-full border border-slate-700/50 items-center justify-center z-10 touch-none">
        <div id="joystick-handle" class="w-16 h-16 bg-amber-500/80 rounded-full shadow-lg transform transition-transform duration-75 pointer-events-none"></div>
    </div>

    <!-- Mobile Jump / Push Button (Right) -->
    <div id="jump-btn" class="mobile-ui absolute bottom-10 right-10 w-24 h-24 bg-amber-500/90 active:bg-amber-400 backdrop-blur-md rounded-full border-2 border-amber-300/60 shadow-2xl items-center justify-center z-10 text-slate-950 font-black text-lg uppercase tracking-wider touch-none">
        Jump
    </div>

    <!-- Start Overlay -->
    <div id="start-overlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-md z-20 flex flex-col items-center justify-center text-white cursor-pointer transition-opacity duration-300">
        <div class="bg-slate-900 border-2 border-amber-500/60 p-8 rounded-3xl max-w-lg text-center shadow-2xl transform hover:scale-105 transition-all">
            <div class="text-7xl mb-4 animate-bounce">🦧</div>
            <h2 class="text-3xl font-extrabold text-amber-400 mb-2">VR FREESTYLE PARKOUR</h2>
            <p class="text-slate-300 text-sm mb-5 leading-relaxed">
                Pure gorilla parkour sandbox! Use <b class="text-amber-300">RDFG / Joystick</b> to move, look around with mouse/touch, and launch high into trees!
            </p>
            <div class="inline-block bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-black px-8 py-3.5 rounded-xl uppercase tracking-wider shadow-xl hover:from-amber-400 hover:to-amber-500">
                Click / Tap To Enter Sandbox
            </div>
        </div>
    </div>

    <script>
        const KEYS = { r: false, d: false, f: false, g: false, space: false, shift: false };
        let isPointerLocked = false;

        // Mobile Virtual Controls State
        let mobileMoveDir = { x: 0, y: 0 };
        let mobileJumpPressed = false;

        // Sound System
        const AudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playThumpSound(freq = 130, duration = 0.12) {
            if (AudioCtx.state === 'suspended') AudioCtx.resume();
            const osc = AudioCtx.createOscillator();
            const gain = AudioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, AudioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, AudioCtx.currentTime + duration);
            gain.gain.setValueAtTime(0.4, AudioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, AudioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(AudioCtx.destination);
            osc.start();
            osc.stop(AudioCtx.currentTime + duration);
        }

        function generateProceduralTextures() {
            const cGround = document.createElement('canvas');
            cGround.width = cGround.height = 512;
            const ctxG = cGround.getContext('2d');
            ctxG.fillStyle = '#224a1d';
            ctxG.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 8000; i++) {
                ctxG.fillStyle = Math.random() > 0.4 ? '#2d6126' : (Math.random() > 0.5 ? '#173613' : '#3d7a34');
                ctxG.fillRect(Math.random() * 512, Math.random() * 512, 2, 5);
            }
            const groundTex = new THREE.CanvasTexture(cGround);
            groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping;
            groundTex.repeat.set(50, 50);

            const cBark = document.createElement('canvas');
            cBark.width = cBark.height = 256;
            const ctxB = cBark.getContext('2d');
            ctxB.fillStyle = '#3b230d';
            ctxB.fillRect(0, 0, 256, 256);
            ctxB.fillStyle = '#241406';
            for (let i = 0; i < 160; i++) {
                ctxB.fillRect(Math.random() * 256, 0, Math.random() * 8 + 3, 256);
            }
            const barkTex = new THREE.CanvasTexture(cBark);
            barkTex.wrapS = barkTex.wrapT = THREE.RepeatWrapping;
            barkTex.repeat.set(1, 8);

            const cFur = document.createElement('canvas');
            cFur.width = cFur.height = 256;
            const ctxF = cFur.getContext('2d');
            ctxF.fillStyle = '#222326';
            ctxF.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 2000; i++) {
                ctxF.fillStyle = Math.random() > 0.5 ? '#141416' : '#35373d';
                ctxF.fillRect(Math.random() * 256, Math.random() * 256, 3, 3);
            }
            const furTex = new THREE.CanvasTexture(cFur);

            const cPalm = document.createElement('canvas');
            cPalm.width = cPalm.height = 128;
            const ctxP = cPalm.getContext('2d');
            ctxP.fillStyle = '#1c1716';
            ctxP.fillRect(0, 0, 128, 128);
            for (let i = 0; i < 300; i++) {
                ctxP.fillStyle = '#2a2321';
                ctxP.fillRect(Math.random() * 128, Math.random() * 128, 2, 2);
            }
            const palmTex = new THREE.CanvasTexture(cPalm);

            return { groundTex, barkTex, furTex, palmTex };
        }

        const textures = generateProceduralTextures();

        const canvas = document.getElementById('game-canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x6ca6cd);
        scene.fog = new THREE.FogExp2(0x6ca6cd, 0.006);

        const camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfffaed, 1.0);
        dirLight.position.set(120, 180, 80);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 400;
        const d = 150;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        const world = new CANNON.World();
        world.gravity.set(0, -28, 0);
        world.broadphase = new CANNON.NaiveBroadphase();
        world.solver.iterations = 10;

        const physicsMaterials = {
            ground: new CANNON.Material('ground'),
            player: new CANNON.Material('player')
        };

        const contactMaterial = new CANNON.ContactMaterial(
            physicsMaterials.ground,
            physicsMaterials.player,
            { friction: 0.9, restitution: 0.15 }
        );
        world.addContactMaterial(contactMaterial);

        const groundSize = 300;
        const groundGeo = new THREE.PlaneGeometry(groundSize, groundSize, 32, 32);
        const groundMat = new THREE.MeshStandardMaterial({
            map: textures.groundTex,
            roughness: 0.9,
            metalness: 0.05
        });
        const groundMesh = new THREE.Mesh(groundGeo, groundMat);
        groundMesh.rotation.x = -Math.PI / 2;
        groundMesh.receiveShadow = true;
        scene.add(groundMesh);

        const groundShape = new CANNON.Plane();
        const groundBody = new CANNON.Body({ mass: 0, material: physicsMaterials.ground });
        groundBody.addShape(groundShape);
        groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
        world.addBody(groundBody);

        const wallMat = new THREE.MeshStandardMaterial({ map: textures.barkTex, roughness: 0.8 });
        function createWall(x, z, w, h, d) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
            mesh.position.set(x, h / 2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            const shape = new CANNON.Box(new CANNON.Vec3(w / 2, h / 2, d / 2));
            const body = new CANNON.Body({ mass: 0, material: physicsMaterials.ground });
            body.addShape(shape);
            body.position.set(x, h / 2, z);
            world.addBody(body);
        }
        const wallHeight = 50;
        createWall(0, -groundSize / 2, groundSize, wallHeight, 4);
        createWall(0, groundSize / 2, groundSize, wallHeight, 4);
        createWall(-groundSize / 2, 0, 4, wallHeight, groundSize);
        createWall(groundSize / 2, 0, 4, wallHeight, groundSize);

        const treeLeavesGeo = new THREE.ConeGeometry(10, 18, 8);
        const leavesMat = new THREE.MeshStandardMaterial({ color: 0x226b2b, roughness: 0.6 });

        function spawnTree(x, z, heightScale = 1) {
            const group = new THREE.Group();
            const trunkHeight = 26 * heightScale;
            const trunkRadiusTop = 1.6 * heightScale;
            const trunkRadiusBottom = 2.8 * heightScale;

            const trunkGeo = new THREE.CylinderGeometry(trunkRadiusTop, trunkRadiusBottom, trunkHeight, 10);
            const trunk = new THREE.Mesh(trunkGeo, wallMat);
            trunk.position.y = trunkHeight / 2;
            trunk.castShadow = true;
            trunk.receiveShadow = true;
            group.add(trunk);

            const leaves1 = new THREE.Mesh(treeLeavesGeo, leavesMat);
            leaves1.position.y = trunkHeight - 2;
            leaves1.scale.set(1.3 * heightScale, 1.2 * heightScale, 1.3 * heightScale);
            leaves1.castShadow = true;
            group.add(leaves1);

            const leaves2 = new THREE.Mesh(treeLeavesGeo, leavesMat);
            leaves2.position.y = trunkHeight + 6;
            leaves2.scale.set(1.0 * heightScale, 1.0 * heightScale, 1.0 * heightScale);
            leaves2.castShadow = true;
            group.add(leaves2);

            const numBranches = 6;
            for (let i = 0; i < numBranches; i++) {
                const branchWidth = 8.0 * heightScale;
                const branchHeight = 0.7;
                const branchDepth = 2.4;
                const branch = new THREE.Mesh(new THREE.BoxGeometry(branchWidth, branchHeight, branchDepth), wallMat);
                const angle = (i * Math.PI * 2) / 3.8 + Math.random() * 0.3;
                const branchY = 7 + i * (trunkHeight * 0.15);

                branch.position.set(Math.cos(angle) * (branchWidth * 0.45), branchY, Math.sin(angle) * (branchWidth * 0.45));
                branch.rotation.y = -angle;
                branch.castShadow = true;
                branch.receiveShadow = true;
                group.add(branch);

                const bShape = new CANNON.Box(new CANNON.Vec3(branchWidth / 2, branchHeight / 2, branchDepth / 2));
                const bBody = new CANNON.Body({ mass: 0, material: physicsMaterials.ground });
                bBody.addShape(bShape);
                bBody.position.set(x + branch.position.x, branchY, z + branch.position.z);
                bBody.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), -angle);
                world.addBody(bBody);
            }

            group.position.set(x, 0, z);
            scene.add(group);

            const trunkShape = new CANNON.Cylinder(trunkRadiusBottom, trunkRadiusBottom, trunkHeight, 10);
            const trunkBody = new CANNON.Body({ mass: 0, material: physicsMaterials.ground });
            trunkBody.addShape(trunkShape);
            trunkBody.position.set(x, trunkHeight / 2, z);
            world.addBody(trunkBody);
        }

        function createParkourPlatform(x, y, z, w, h, d, color = 0x8b5a2b) {
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.7 });
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            const shape = new CANNON.Box(new CANNON.Vec3(w / 2, h / 2, d / 2));
            const body = new CANNON.Body({ mass: 0, material: physicsMaterials.ground });
            body.addShape(shape);
            body.position.set(x, y, z);
            world.addBody(body);
        }

        const treePositions = [
            [-45, -45, 1.5], [45, -35, 1.6], [-55, 50, 1.4], [58, 45, 1.7],
            [0, -65, 1.8], [0, 60, 1.5], [-80, -15, 1.6], [80, 25, 1.7],
            [-35, 90, 1.3], [38, -90, 1.4], [-95, -80, 1.9], [95, 80, 1.8]
        ];
        treePositions.forEach(pos => spawnTree(pos[0], pos[1], pos[2]));
        spawnTree(0, 0, 2.5);

        createParkourPlatform(20, 4, 15, 12, 8, 12, 0x9b6b3b);
        createParkourPlatform(35, 9, 25, 10, 18, 10, 0x8a5a2b);
        createParkourPlatform(50, 15, 35, 12, 30, 12, 0x7a4a1b);
        createParkourPlatform(-25, 3, -15, 14, 1.5, 8, 0xa57545);
        createParkourPlatform(-40, 7, -25, 14, 1.5, 8, 0xa57545);

        const furMaterial = new THREE.MeshStandardMaterial({ map: textures.furTex, roughness: 0.85 });
        const palmMaterial = new THREE.MeshStandardMaterial({ map: textures.palmTex, roughness: 0.6 });

        function createRealisticHand(isRight = false) {
            const handGroup = new THREE.Group();

            const palmGeo = new THREE.BoxGeometry(0.38, 0.14, 0.45);
            const palmMesh = new THREE.Mesh(palmGeo, palmMaterial);
            palmMesh.castShadow = true;
            handGroup.add(palmMesh);

            const backFurGeo = new THREE.BoxGeometry(0.40, 0.08, 0.47);
            const backFurMesh = new THREE.Mesh(backFurGeo, furMaterial);
            backFurMesh.position.set(0, 0.06, 0);
            backFurMesh.castShadow = true;
            handGroup.add(backFurMesh);

            const armGeo = new THREE.CylinderGeometry(0.18, 0.22, 0.6, 10);
            const armMesh = new THREE.Mesh(armGeo, furMaterial);
            armMesh.rotation.x = Math.PI / 2;
            armMesh.position.set(0, 0.05, 0.4);
            armMesh.castShadow = true;
            handGroup.add(armMesh);

            const fingerPositionsX = [-0.13, -0.04, 0.05, 0.14];
            fingerPositionsX.forEach((fX) => {
                const fingerGroup = new THREE.Group();
                const seg1 = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, 0.16), palmMaterial);
                seg1.position.z = -0.08;
                seg1.castShadow = true;
                fingerGroup.add(seg1);

                const seg2 = new THREE.Mesh(new THREE.BoxGeometry(0.065, 0.065, 0.14), palmMaterial);
                seg2.position.set(0, -0.03, -0.21);
                seg2.rotation.x = 0.35;
                seg2.castShadow = true;
                fingerGroup.add(seg2);

                fingerGroup.position.set(fX, -0.02, -0.22);
                handGroup.add(fingerGroup);
            });

            const thumbGroup = new THREE.Group();
            const thumbSeg1 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.18), palmMaterial);
            thumbSeg1.position.z = -0.09;
            thumbGroup.add(thumbSeg1);

            const sideSign = isRight ? 1 : -1;
            thumbGroup.position.set(sideSign * 0.22, -0.02, -0.05);
            thumbGroup.rotation.y = sideSign * -0.75;
            thumbGroup.rotation.x = 0.2;
            handGroup.add(thumbGroup);

            handGroup.scale.set(1.15, 1.15, 1.15);
            return handGroup;
        }

        const leftHandMesh = createRealisticHand(false);
        const rightHandMesh = createRealisticHand(true);
        scene.add(leftHandMesh);
        scene.add(rightHandMesh);

        const playerRadius = 1.25;
        const playerShape = new CANNON.Sphere(playerRadius);
        const playerBody = new CANNON.Body({
            mass: 65,
            material: physicsMaterials.player,
            linearDamping: 0.15,
            fixedRotation: true
        });
        playerBody.addShape(playerShape);
        playerBody.position.set(0, 5, 20);
        world.addBody(playerBody);

        let pitch = 0;
        let yaw = 0;

        // Desktop keyboard controls
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'r') KEYS.r = true;
            if (key === 'd') KEYS.d = true;
            if (key === 'f') KEYS.f = true;
            if (key === 'g') KEYS.g = true;
            if (e.code === 'Space') KEYS.space = true;
            if (e.shiftKey) KEYS.shift = true;
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'r') KEYS.r = false;
            if (key === 'd') KEYS.d = false;
            if (key === 'f') KEYS.f = false;
            if (key === 'g') KEYS.g = false;
            if (e.code === 'Space') KEYS.space = false;
            if (!e.shiftKey) KEYS.shift = false;
        });

        const overlay = document.getElementById('start-overlay');
        overlay.addEventListener('click', () => {
            if (!window.matchMedia('(pointer: coarse)').matches) {
                canvas.requestPointerLock();
            }
            overlay.classList.add('opacity-0', 'pointer-events-none');
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === canvas) {
                isPointerLocked = true;
                overlay.classList.add('opacity-0', 'pointer-events-none');
            } else {
                isPointerLocked = false;
                overlay.classList.remove('opacity-0', 'pointer-events-none');
            }
        });

        // Mouse Look
        document.addEventListener('mousemove', (e) => {
            if (!isPointerLocked && !window.matchMedia('(pointer: coarse)').matches) return;
            const sensitivity = 0.0028;
            yaw -= e.movementX * sensitivity;
            pitch -= e.movementY * sensitivity;
            pitch = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, pitch));
        });

        // Mobile Touch Look & Joystick logic
        let touchLookId = null;
        let lastTouchX = 0, lastTouchY = 0;
        let joystickTouchId = null;
        let joystickCenter = { x: 0, y: 0 };

        window.addEventListener('touchstart', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.clientX < window.innerWidth / 2 && joystickTouchId === null) {
                    joystickTouchId = t.identifier;
                    joystickCenter = { x: t.clientX, y: t.clientY };
                } 
                else if (t.clientX >= window.innerWidth / 2 && touchLookId === null) {
                    touchLookId = t.identifier;
                    lastTouchX = t.clientX;
                    lastTouchY = t.clientY;
                }
            }
        });

        window.addEventListener('touchmove', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.identifier === joystickTouchId) {
                    const dx = t.clientX - joystickCenter.x;
                    const dy = t.clientY - joystickCenter.y;
                    const dist = Math.min(50, Math.sqrt(dx * dx + dy * dy));
                    const angle = Math.atan2(dy, dx);
                    
                    mobileMoveDir.x = (Math.cos(angle) * dist) / 50;
                    mobileMoveDir.y = -(Math.sin(angle) * dist) / 50;

                    const handle = document.getElementById('joystick-handle');
                    handle.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
                } else if (t.identifier === touchLookId) {
                    const movementX = t.clientX - lastTouchX;
                    const movementY = t.clientY - lastTouchY;
                    lastTouchX = t.clientX;
                    lastTouchY = t.clientY;

                    const sensitivity = 0.004;
                    yaw -= movementX * sensitivity;
                    pitch -= movementY * sensitivity;
                    pitch = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, pitch));
                }
            }
        });

        window.addEventListener('touchend', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.identifier === joystickTouchId) {
                    joystickTouchId = null;
                    mobileMoveDir = { x: 0, y: 0 };
                    document.getElementById('joystick-handle').style.transform = `translate(0px, 0px)`;
                }
                if (t.identifier === touchLookId) {
                    touchLookId = null;
                }
            }
        });

        // Mobile Jump Button Event
        const jumpBtn = document.getElementById('jump-btn');
        jumpBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            mobileJumpPressed = true;
        });
        jumpBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            mobileJumpPressed = false;
        });

        function isGrounded() {
            const ray = new THREE.Raycaster(
                new THREE.Vector3().copy(playerBody.position),
                new THREE.Vector3(0, -1, 0),
                0,
                playerRadius + 0.45
            );
            const intersects = ray.intersectObjects(scene.children, true);
            return intersects.length > 0;
        }

        let handBob = 0;
        let headShakeTime = 0;
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);
            world.step(1 / 60, delta, 3);

            const currentSpeed = Math.sqrt(playerBody.velocity.x ** 2 + playerBody.velocity.z ** 2);

            headShakeTime += delta * (currentSpeed > 2 ? currentSpeed * 0.8 : 1.5);
            const breathSwayX = Math.sin(headShakeTime * 0.8) * 0.015;
            const breathSwayY = Math.cos(headShakeTime * 1.2) * 0.012;

            const isMoving = KEYS.r || KEYS.d || KEYS.f || KEYS.g || mobileMoveDir.x !== 0 || mobileMoveDir.y !== 0;
            if (isMoving) {
                handBob += delta * Math.max(12, currentSpeed * 0.85);
            } else {
                handBob += delta * 2;
            }

            const headBobX = isMoving ? Math.sin(handBob * 0.5) * 0.04 * Math.min(1.5, currentSpeed * 0.1) : 0;
            const headBobY = isMoving ? Math.abs(Math.sin(handBob)) * 0.06 * Math.min(1.5, currentSpeed * 0.1) : 0;

            const baseHeadPos = new THREE.Vector3().copy(playerBody.position).add(new THREE.Vector3(headBobX + breathSwayX, 0.7 + headBobY + breathSwayY, 0));
            camera.position.copy(baseHeadPos);

            const cameraRoll = isMoving ? Math.sin(handBob * 0.5) * 0.025 : 0;
            const euler = new THREE.Euler(pitch, yaw, cameraRoll, 'YXZ');
            camera.quaternion.setFromEuler(euler);

            const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

            const moveDir = new THREE.Vector3(0, 0, 0);
            if (KEYS.r) moveDir.add(forward);
            if (KEYS.f) moveDir.sub(forward);
            if (KEYS.d) moveDir.sub(right);
            if (KEYS.g) moveDir.add(right);

            if (mobileMoveDir.y !== 0) {
                const fCopy = forward.clone().multiplyScalar(mobileMoveDir.y);
                moveDir.add(fCopy);
            }
            if (mobileMoveDir.x !== 0) {
                const rCopy = right.clone().multiplyScalar(mobileMoveDir.x);
                moveDir.add(rCopy);
            }

            if (moveDir.lengthSq() > 0) moveDir.normalize();

            const moveSpeed = 22.0;
            const grounded = isGrounded();

            if (grounded) {
                playerBody.velocity.x += moveDir.x * moveSpeed * delta * 8.0;
                playerBody.velocity.z += moveDir.z * moveSpeed * delta * 8.0;

                if (KEYS.space || KEYS.shift || mobileJumpPressed) {
                    playerBody.velocity.y = 16.5;
                    playThumpSound(190, 0.2);
                }
            } else {
                playerBody.velocity.x += moveDir.x * moveSpeed * delta * 3.0;
                playerBody.velocity.z += moveDir.z * moveSpeed * delta * 3.0;
            }

            const yawQuaternion = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            const lSwing = Math.sin(handBob) * 0.22;
            const rSwing = Math.cos(handBob) * 0.22;

            const leftHandOffset = new THREE.Vector3(-0.55, -0.65 + lSwing * 0.5, -0.55 + lSwing);
            const rightHandOffset = new THREE.Vector3(0.55, -0.65 + rSwing * 0.5, -0.55 + rSwing);

            leftHandMesh.position.copy(baseHeadPos).add(leftHandOffset.applyQuaternion(yawQuaternion));
            rightHandMesh.position.copy(baseHeadPos).add(rightHandOffset.applyQuaternion(yawQuaternion));

            const handRotEuler = new THREE.Euler(pitch * 0.3, yaw, 0, 'YXZ');
            leftHandMesh.quaternion.setFromEuler(handRotEuler);
            rightHandMesh.quaternion.setFromEuler(handRotEuler);

            if (grounded && isMoving && Math.sin(handBob * 2) > 0.9) {
                playThumpSound(100, 0.08);
            }

            const bound = groundSize / 2 - 4;
            if (Math.abs(playerBody.position.x) > bound) playerBody.position.x = Math.sign(playerBody.position.x) * bound;
            if (Math.abs(playerBody.position.z) > bound) playerBody.position.z = Math.sign(playerBody.position.z) * bound;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
